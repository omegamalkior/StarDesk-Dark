# Run once by hand (Actions tab > Publish releases > Run workflow).
# Creates the release from the zips kept on the "release-files" branch.
name: Publish release
on: workflow_dispatch
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: release-files
          path: files
      - name: StarDesk Dark 1.0 release
        run: |
          gh release view v1.0 >/dev/null 2>&1 || gh release create v1.0 files/StarDesk-Dark-Easy-Patch.zip files/StarDesk-Dark-Developer-Patch.zip --target main --latest --title "StarDesk Dark 1.0" --notes-file .github/release-notes/v1.0.md
